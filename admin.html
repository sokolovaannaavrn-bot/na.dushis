<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURA — управление каталогом</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="logo" href="index.html">AURA<span>.</span></a><nav><a href="index.html">← Вернуться в магазин</a></nav></header><main class="catalog"><small>УПРАВЛЕНИЕ МАГАЗИНОМ</small><h1>Каталог товаров</h1><p>Демо-редактор: изменения сохраняются в браузере. Для общего доступа подключим базу Supabase.</p><form id="form"><input id="brand" placeholder="Бренд" required><input id="name" placeholder="Название аромата" required><select id="type"><option value="women">Женские</option><option value="men">Мужские</option><option value="unisex">Унисекс</option></select><input id="price" type="number" placeholder="Цена, ₽" required><button class="button">Добавить товар</button></form><div id="list"></div></main><script>let data=JSON.parse(localStorage.getItem('aura-products')||'null')||[{brand:'Maison Margiela',name:'REPLICA Jazz Club',type:'unisex',price:8900},{brand:'Aesop',name:'Hwyl',type:'men',price:12600},{brand:'Byredo',name:'Bal d’Afrique',type:'women',price:18900},{brand:'Diptyque',name:'Philosykos',type:'unisex',price:15400}];const save=()=>{localStorage.setItem('aura-products',JSON.stringify(data));draw()};function draw(){list.innerHTML=data.map((p,i)=>`<div class="cart"><span><b>${p.brand}</b> — ${p.name}</span><span>${p.price.toLocaleString('ru-RU')} ₽ <button onclick="data.splice(${i},1);save()">Удалить</button></span></div>`).join('')}form.onsubmit=e=>{e.preventDefault();data.push({brand:brand.value,name:name.value,type:type.value,price:+price.value});save();form.reset()};draw()</script></body></html>
